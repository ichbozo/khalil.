<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ورشة خليل</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;900&display=swap">
<style>
:root{--bg:#F3F5F6;--surface:#FFF;--ink:#13262E;--muted:#5B6C73;--line:#D6DEE0;--brand:#0F3446;--brand2:#16495F;--on-brand:#F3F5F6;--signal:#F26A1B;--on-signal:#FFF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1A20;--surface:#14262E;--ink:#EAF0F1;--muted:#9DB0B7;--line:#27404B;--brand:#091F2A;--brand2:#0F3141;--on-brand:#EAF0F1;--signal:#FF7C35;--on-signal:#13262E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1A20;--surface:#14262E;--ink:#EAF0F1;--muted:#9DB0B7;--line:#27404B;--brand:#091F2A;--brand2:#0F3141;--on-brand:#EAF0F1;--signal:#FF7C35;--on-signal:#13262E;color-scheme:dark}
html{scroll-padding-top:70px;scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",Tahoma,"Segoe UI",sans-serif;line-height:1.75;font-size:17px}
a{color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{background:var(--brand);color:var(--on-brand);position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;gap:18px;padding-top:10px;padding-bottom:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.3rem;text-decoration:none;margin-inline-end:auto}
.logo svg{width:34px;height:34px;color:var(--signal)}
nav{display:flex;gap:20px;font-size:.95rem}
nav a{text-decoration:none;opacity:.85}nav a:hover{opacity:1}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--signal);color:var(--on-signal);font:inherit;font-weight:700;padding:9px 20px;border:0;border-radius:8px;text-decoration:none;cursor:pointer}
.lang{background:transparent;color:var(--on-brand);border:1.5px solid rgba(255,255,255,.45);padding:6px 14px;font-weight:700}
.btn svg{width:18px;height:18px}
.hero{background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--on-brand);padding:48px 0 0;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:end}.hero-t{padding-bottom:72px}
h1{font-weight:900;font-size:clamp(2.1rem,5vw,3.4rem);line-height:1.3;margin:0 0 16px}
.hero p{font-size:1.1rem;max-width:34em;opacity:.9;margin:0 0 26px}
.gears{position:relative;height:430px;display:flex;justify-content:flex-start;align-items:flex-end;direction:ltr}.gears img{position:relative;z-index:1;opacity:.8;height:100%;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 14px 26px rgba(0,0,0,.4))}
.gears svg{position:absolute}
.g1{width:130px;height:130px;color:#F6B93B;opacity:.9;right:0;top:30px;animation:spin 14s linear infinite}
.g2{width:96px;height:96px;color:#2EC4B6;opacity:.9;right:8px;top:250px;animation:spin 9s linear infinite reverse}
.g3{width:68px;height:68px;color:var(--signal);opacity:.9;right:70px;top:160px;animation:spin 6s linear infinite reverse}
.badge{position:absolute;z-index:5;left:0;bottom:24px;background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 16px;font-weight:600;font-size:.95rem;display:flex;gap:8px;align-items:center;border-inline-start:6px solid #2EC4B6}
.badge i{width:10px;height:10px;border-radius:50%;background:#2EC4B6;animation:pulse 1.8s infinite}
section{padding:64px 0}
h2.t{font-size:clamp(1.6rem,3.5vw,2.2rem);font-weight:900;margin:0 0 28px;line-height:1.3}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.12)}
.ic{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;margin-bottom:12px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.ic svg{width:30px;height:30px}
.card h3{margin:0 0 4px;font-size:1.1rem}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.a-spin{animation:spin 8s linear infinite}.a-bob{animation:bob 2.2s ease-in-out infinite}.a-flash{animation:flash 1.6s infinite}.a-slide{animation:slide 2.4s ease-in-out infinite}.a-wob{animation:wob 2.4s ease-in-out infinite}
.card:hover .ic svg{animation-duration:2s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes slide{50%{transform:translateX(4px)}}
@keyframes wob{50%{transform:rotate(-18deg)}}
@keyframes pulse{50%{opacity:.3;transform:scale(1.5)}}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;border-top:4px solid var(--signal);padding-top:12px}
.steps li::before{content:counter(s);font-weight:900;font-size:2rem;color:var(--signal);display:block;line-height:1.2}
.steps b{display:block}.steps span{color:var(--muted);font-size:.95rem}
.contact{background:var(--surface);border-block:1px solid var(--line)}
.contact .wrap{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.row{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.row .ic{margin:0;flex:none}
.row b{display:block}
form{display:grid;gap:14px}
label{font-weight:600;font-size:.95rem;display:grid;gap:4px}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
footer{background:var(--brand);color:var(--on-brand);padding:22px 0;font-size:.9rem}
@media (max-width:760px){.hero .wrap,.contact .wrap{grid-template-columns:1fr}nav{display:none}section{padding:46px 0}.gears{height:380px}.hero-t{padding-bottom:36px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
